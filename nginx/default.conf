server {
      listen 80;
      server_name _;

      root /usr/share/nginx/html;
      index index.php index.html;

      location / {
          try_files $uri $uri/ =404;
      }

      location ~ \.php$ {
          try_files $uri =404;
          fastcgi_pass php:9000;
          include fastcgi_params;
          fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
      }
  }