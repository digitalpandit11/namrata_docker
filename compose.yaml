services:
    web:
      build: .
      image: namrata-site
      container_name: namrata-site
      ports:
        - "8081:80"
      depends_on:
        - php

    php:
      build:
        context: .
        dockerfile: php/Dockerfile
      image: namrata-site-php
      container_name: namrata-site-php
      environment:
        DB_HOST: db
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}
        DB_PASS: ${DB_PASSWORD}
      depends_on:
          - db

    db:
      image: mysql:8.4
      container_name: namrata-site-db
      restart: unless-stopped
      environment:
        MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        MYSQL_DATABASE: ${DB_NAME}
        MYSQL_USER: ${DB_USER}
        MYSQL_PASSWORD: ${DB_PASSWORD}
      volumes:
        - db-data:/var/lib/mysql
        - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      ports:
        - "127.0.0.1:3308:3306"
volumes:
  db-data: